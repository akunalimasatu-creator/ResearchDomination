name: Build Mac Installer (Maven)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Maven
      run: mvn clean package

    - name: Create Mac DMG using jpackage
      run: |
        jpackage \
          --type dmg \
          --name "ResearchDomination" \
          --app-version "1.0.0" \
          --input target \
          --main-jar cardgame-1.0-SNAPSHOT.jar \
          --main-class com.example.cardgame.AppLauncher \
          --dest dist \
          --vendor "Developer"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-installer-dmg
        path: dist/*.dmg